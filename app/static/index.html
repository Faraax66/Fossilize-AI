<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fossilize AI</title>
<link rel="icon" type="image/png" href="assets/icons/logo.png">

<!-- FONTS: Manrope (default UI), Overlock (dialogs/responses), Urbanist (wordmark) -->
<!-- If you'd rather self-host these instead of Google Fonts CDN, say so and I'll swap this for @font-face pointing at local .woff2 files -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Overlock:wght@400;700&family=Urbanist:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .msg-row { display: flex; }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.assistant { justify-content: flex-start; }

  .bubble-user {
    max-width: 70%;
    padding: 7.5px 16px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--bubble-start), var(--bubble-end));
    color: #1c150c;
    font-family: 'Overlock', serif;
    margin-right: 40px;
    font-size: 17px;
    line-height: 1.5;
    font-weight: 400;
  }

  .assistant-block { max-width: 78%; display: flex;margin-left: 40px; flex-direction: column; gap: 8px; }
  .intent-tag {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-muted); font-family: "SFMono-Regular", Consolas, monospace;
    width: fit-content;
  }
  .intent-tag .dot { width: 6px; height: 6px; border-radius: 50%; }
  .intent-tag.knowledge_query .dot { background: var(--amber); }
  .intent-tag.dashboard_query .dot { background: #7FA37A; }
  .intent-tag.ambiguous .dot { background: #6b6d78; }
  .intent-tag.blocked .dot { background: #B5573F; }

  .assistant-text {
    font-family: 'Overlock', serif;
    font-size: 17px; line-height: 1.65; color: var(--text);
    white-space: pre-wrap;
  }
  .assistant-text.blocked { color: #D08A78; }

  .loading-row { display: flex; align-items: center;margin-left: 55px;  gap: 10px; color: var(--text-muted); font-size: 13.5px; }
  .loading-mark { width: 40px; height: 40px; }

  /* dashboard card */
  .dashboard-card {
    border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; background: var(--panel);
    font-family: 'Overlock', serif;
    font-size: 17px; line-height: 1.6;
  }
  .dashboard-card h4 {
    margin: 0 0 10px 0; font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--amber-light);
    font-family: 'Manrope', sans-serif; /* label stays UI font, not the response font */
  }
  #chat-window {
    flex: 1; overflow-y: auto; padding: 28px 10%;
    display: flex; flex-direction: column; gap: 22px;
  }
  @media (max-width: 900px) { #chat-window { padding: 20px 5%; } }

  #composer-wrap { padding: 18px 10%; }
  @media (max-width: 900px) { #composer-wrap { padding: 14px 5%; } }

  #composer {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 14px 16px 10px 16px;
  }
  #composer textarea {
    width: 100%; background: transparent; border: none; outline: none; resize: none;
    color: var(--text); font-size: 14.5px; font-family: inherit;
    min-height: 22px; max-height: 160px; line-height: 1.5;
  }
  #composer textarea::placeholder { color: var(--text-muted); }

  .composer-bottom-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px;
  }
  .composer-left-assets { display: flex; align-items: center; gap: 10px; color: var(--text-muted); }
  .model-select {
    display: flex; align-items: center; gap: 4px;
    font-size: 12.5px; color: var(--text-muted); cursor: default;
    user-select: none;
  }
  .composer-right { display: flex; align-items: center; gap: 12px; }

  #send-btn {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--amber); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #send-btn svg { width: 16px; height: 16px; }
</style>
</head>
<body>

<div id="app">

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div id="sidebar-resize-handle"></div>
    <div class="brand">
      <div class="brand-left">
        <img class="brand-mark" src="assets/icons/logo.png" alt="Fossilize AI" />
        <span class="brand-name">FOSSILIZE AI</span>
      </div>
      <div class="brand-icons">
        <button class="icon-btn icon-search" title="Search">
          <img src="assets/icons/search.png" alt="Search" />
        </button>
        <button class="icon-btn" id="collapse-btn" title="Collapse sidebar">
          <img src="assets/icons/left.png" alt="Collapse" />
        </button>
      </div>
    </div>

    <nav class="main-nav">
      <div class="nav-item" id="new-chat-btn">
        <img src="assets/icons/new.png" alt="" />
        <span class="nav-label">New chat</span>
      </div>
      <div class="nav-item" data-page="chat">
        <img src="assets/icons/chats.png" alt="" />
        <span class="nav-label">Chats</span>
      </div>
      <div class="nav-item">
        <img src="assets/icons/projects.png" alt="" />
        <span class="nav-label">Projects</span>
      </div>
      <!-- Dashboard: enabled only for manager persona, toggled in JS below -->
      <div class="nav-item disabled" id="nav-dashboard" data-page="dashboard" title="Manager access only" onclick="if(!this.classList.contains('disabled')) window.location.href='/dashboard'">
        <img src="/assets/icons/dashboard.png" alt="" />
        <span class="nav-label">Dashboard</span>
      </div>
      <div class="nav-item disabled" id="nav-pr-guardian" data-page="pr-guardian" title="Manager access only" onclick="if(!this.classList.contains('disabled')) window.location.href='/pr-guardian'">
        <img src="/assets/icons/guard.png" alt="" />
        <span class="nav-label">PR Guardian</span>
      </div>
    </nav>

    <div class="recents-label">Recents</div>
    <div class="recents-list" id="recents-list"></div>
    <div class="profile-strip" id="profile-strip">
      <div class="profile-left">
        <div class="avatar" id="avatar-letter">A</div>
        <div>
          <div class="profile-name" id="profile-name">Loading…</div>
          <div class="profile-role" id="profile-role">&nbsp;</div>
        </div>
      </div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-muted)"><polyline points="6 9 12 15 18 9"/></svg>

      <div class="persona-menu" id="persona-menu"></div>
    </div>
  </aside>

  <!-- MAIN -->
  <main id="main">
    <div id="topbar">
      <div class="chat-title-wrap" id="chat-title-wrap">
        <span class="chat-title" id="chat-title">A/chatbox</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-muted)"><polyline points="6 9 12 15 18 9"/></svg>
        <div class="title-dropdown" id="title-dropdown">
          <div class="title-dropdown-item" id="td-rename">Rename</div>
          <div class="title-dropdown-item" id="td-archive">Archive</div>
          <div class="title-dropdown-item danger" id="td-delete">Delete</div>
        </div>
      </div>
      <div class="topbar-icons">
        <button class="icon-btn" id="delete-chat-btn" title="Delete chat">
          <img src="assets/icons/delete.png" alt="Delete" />
        </button>
        <button class="icon-btn" id="export-chat-btn" title="Export">
          <img src="assets/icons/share.png" alt="Export" />
        </button>
        <button class="icon-btn" id="archive-chat-btn" title="Archive">
          <img src="assets/icons/archives.png" alt="Archive" />
        </button>
      </div>
    </div>

    <div id="chat-window"></div>

    <div id="composer-wrap">
      <div id="composer">
        <textarea id="message-input" placeholder="Ask Fossilize" rows="1"></textarea>
        <div class="composer-bottom-row">
          <div class="composer-left-assets">
            <button class="icon-btn" title="Attach">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
            <button class="icon-btn" title="Tools">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>
            </button>
          </div>
          <div class="composer-right">
            <div class="model-select">
              Sonnet 4.6
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
            <button id="send-btn" title="Send" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="#1c150c" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

</div>
<script src="sidebar.js"></script>

function loadCurrentChatIntoWindow() {
  const chat = getCurrentChat();
  history = chat.history || [];
  document.getElementById("chat-title").textContent = chat.title;
  chatWindow.innerHTML = "";
  history.forEach(m => {
    if (m.role === "user") appendMessage("user", m.content);
    else appendMessage("assistant", m.content, m.intent);
  });
}

function deleteCurrentChat() {
  const chats = loadChats();
  const currentId = getCurrentChatId();
  const remaining = chats.filter(c => c.id !== currentId);
  saveChats(remaining);
  if (!remaining.filter(c => !c.archived).length) createChat();
  else setCurrentChatId(remaining.find(c => !c.archived).id);
  loadCurrentChatIntoWindow();
  renderRecents();
}

function archiveCurrentChat() {
  updateCurrentChat(chat => { chat.archived = true; });
  const remaining = loadChats().filter(c => !c.archived);
  if (!remaining.length) createChat();
  else setCurrentChatId(remaining[0].id);
  loadCurrentChatIntoWindow();
  renderRecents();
}

function renameCurrentChat() {
  const chat = getCurrentChat();
  const titleEl = document.getElementById("chat-title");
  const input = document.createElement("input");
  input.type = "text";
  input.value = chat.title;
  input.className = "chat-title-input";
  titleEl.replaceWith(input);
  input.focus();
  input.select();

  function commit() {
    const newTitle = input.value.trim() || "New chat";
    updateCurrentChat(c => { c.title = newTitle; });
    input.replaceWith(titleEl);
    titleEl.textContent = newTitle;
    renderRecents();
  }
  let cancelled = false;
  input.addEventListener("blur", () => { if (!cancelled) commit(); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") input.blur();
    if (e.key === "Escape") { cancelled = true; input.replaceWith(titleEl); }
  });
}

document.getElementById("delete-chat-btn").addEventListener("click", deleteCurrentChat);
document.getElementById("archive-chat-btn").addEventListener("click", archiveCurrentChat);

const titleDropdown = document.getElementById("title-dropdown");
document.getElementById("chat-title-wrap").addEventListener("click", (e) => {
  e.stopPropagation();
  titleDropdown.classList.toggle("open");
});
document.addEventListener("click", () => titleDropdown.classList.remove("open"));

document.getElementById("td-rename").addEventListener("click", (e) => {
  e.stopPropagation();
  titleDropdown.classList.remove("open");
  renameCurrentChat();
});
document.getElementById("td-archive").addEventListener("click", (e) => {
  e.stopPropagation();
  titleDropdown.classList.remove("open");
  archiveCurrentChat();
});
document.getElementById("td-delete").addEventListener("click", (e) => {
  e.stopPropagation();
  titleDropdown.classList.remove("open");
  deleteCurrentChat();
});

document.getElementById("export-chat-btn").addEventListener("click", () => {
  const chat = getCurrentChat();
  const md = chat.history.map(m => `**${m.role === "user" ? "You" : "Fossilize AI"}:**\n${m.content}\n`).join("\n");
  const blob = new Blob([md], { type: "text/markdown" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${chat.title.replace(/[^a-z0-9]/gi, "_")}.md`;
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById("new-chat-btn").addEventListener("click", () => {
  createChat();
  loadCurrentChatIntoWindow();
  renderRecents();
});


loadCurrentChatIntoWindow();
  // ---------- intent tag labels ----------
  function intentLabel(intent) {
    const map = {
      knowledge_query: "knowledge query",
      dashboard_query: "dashboard query",
      ambiguous: "clarifying",
      blocked: "blocked"
    };
    return map[intent] || (intent ? intent.replace(/_/g, " ") : "");
  }

  // very light markdown-ish render for dashboard responses
  function renderDashboard(text) {
    const lines = text.split("\n").filter(l => l.trim().length);
    const body = lines.map(l => {
      if (/^#+\s/.test(l)) return `<div style="font-weight:600;margin-top:6px;">${l.replace(/^#+\s/, "")}</div>`;
      if (/^[-*]\s/.test(l)) return `<div>&bull; ${l.replace(/^[-*]\s/, "")}</div>`;
      return `<div>${l}</div>`;
    }).join("");
    return `<div class="dashboard-card"><h4>Knowledge Risk Report</h4>${body}</div>`;
  }
  
  function appendMessage(role, text, intent) {
    const row = document.createElement("div");
    row.className = `msg-row ${role}`;

    if (role === "user") {
      row.innerHTML = `<div class="bubble-user"></div>`;
      row.querySelector(".bubble-user").textContent = text;
    } else {
      const isBlocked = intent === "blocked";
      // remove the footer mark from any previous assistant message — only the latest one keeps it
      chatWindow.querySelectorAll(".assistant-footer").forEach(f => f.remove());
      const block = document.createElement("div");
      block.className = "assistant-block";

      if (intent) {
        const tag = document.createElement("div");
        tag.className = `intent-tag ${intent}`;
        tag.innerHTML = `<span class="dot"></span>${intentLabel(intent)}`;
        block.appendChild(tag);
      }

      if (intent === "dashboard_query") {
        const wrap = document.createElement("div");
        wrap.innerHTML = renderDashboard(text);
        block.appendChild(wrap);
      } else {
        const p = document.createElement("div");
        p.className = "assistant-text" + (isBlocked ? " blocked" : "");
        p.textContent = text;
        block.appendChild(p);
      }
      const footer = document.createElement("div");
      footer.className = "assistant-footer";
      footer.innerHTML = `<img src="assets/icons/logo.png" alt="" class="assistant-mark" />`;
      block.appendChild(footer);

      row.appendChild(block);
    }
    chatWindow.appendChild(row);
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function appendLoading() {
    const row = document.createElement("div");
    row.className = "msg-row assistant";
    row.id = "loading-row";
    row.innerHTML = `
      <div class="loading-row">
        <svg class="loading-mark" viewBox="0 0 1254 1254">${LOADING_SVG_INNER}</svg>
        <span>Curating...</span>
      </div>`;
    chatWindow.querySelectorAll(".assistant-footer").forEach(f => f.remove());
    chatWindow.appendChild(row);
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }
  function removeLoading() {
    const el = document.getElementById("loading-row");
    if (el) el.remove();
  }

  async function sendMessage() {
    const message = messageInput.value.trim();
    if (!message || !currentUser) return;
    const targetChatId = getCurrentChatId();
    appendMessage("user", message);
    history.push({ role: "user", content: message });
    updateCurrentChat(chat => { chat.history = history; });
    messageInput.value = "";
    autosize();
    sendBtn.disabled = true;
    appendLoading();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-User-Id": currentUser.id
        },
        body: JSON.stringify({ message, history })
      });
      if (!res.ok) throw new Error(`Server returned ${res.status}`);
      const data = await res.json();
      removeLoading();

      // Only touch the UI/history if we're still looking at the chat that sent this
      if (getCurrentChatId() === targetChatId) {
        appendMessage("assistant", data.answer, data.intent);
        history.push({ role: "assistant", content: data.answer, intent: data.intent });
      }

      // Always persist into the chat that actually asked, even if user has switched away
      updateChat(targetChatId, chat => {
        if (getCurrentChatId() !== targetChatId) {
          chat.history = [...chat.history, { role: "assistant", content: data.answer, intent: data.intent }];
        } else {
          chat.history = history;
        }
        if (chat.title === "New chat") {
          chat.title = message.slice(0, 40) + (message.length > 40 ? "…" : "");
        }
      });
      renderRecents();
    } catch (err) {
      removeLoading();
      appendMessage("assistant", "Something went wrong reaching the agent. Check the server logs.", "blocked");
      console.error(err);
    } finally {
      sendBtn.disabled = messageInput.value.trim().length === 0;
    }
  }

  function autosize() {
    messageInput.style.height = "auto";
    messageInput.style.height = Math.min(messageInput.scrollHeight, 160) + "px";
  }

  messageInput.addEventListener("input", () => {
    autosize();
    sendBtn.disabled = messageInput.value.trim().length === 0;
  });
  messageInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  sendBtn.addEventListener("click", sendMessage);
</script>
