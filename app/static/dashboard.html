<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fossilize AI — Dashboard</title>

<link rel="icon" type="image/png" href="assets/icons/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Overlock:wght@400;700&family=Urbanist:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
  #content { flex: 1; overflow-y: auto; padding: 28px 8%; display: flex; flex-direction: column; gap: 28px; }
  @media (max-width: 900px) { #content { padding: 20px 5%; } }

  .page-heading { font-size: 20px; font-weight: 600; margin: 0 0 4px 0; }
  .page-subheading { font-size: 13.5px; color: var(--text-muted); margin: 0; }

  .restricted-notice {
    border: 1px solid var(--border); border-radius: 12px;
    padding: 24px; background: var(--panel);
    font-size: 14px; color: var(--text-muted); text-align: center;
  }

  /* summary stat bar */
  .stat-bar {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 1px; background: var(--border-soft);
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
  }
  .stat-cell { background: var(--panel); padding: 16px 18px; }
  .stat-value { font-size: 20px; font-weight: 700; color: var(--amber-light); }
  .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-top: 4px; }

  /* section wrapper */
  .section-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 10px; }

  table.data-table { width: 100%; border-collapse: collapse; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  table.data-table thead th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-muted); background: var(--panel); padding: 10px 14px; border-bottom: 1px solid var(--border);
  }
  table.data-table tbody td {
    padding: 10px 14px; font-size: 13.5px; border-bottom: 1px solid var(--border-soft);
    font-family: 'Overlock', serif;
  }
  table.data-table tbody tr:last-child td { border-bottom: none; }
  table.data-table tbody tr:hover td { background: var(--border-soft); }
  .filename-cell { font-family: "SFMono-Regular", Consolas, monospace !important; font-size: 12.5px; color: var(--text); }
  .risk-badge {
    display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 12px; font-weight: 600;
    font-family: 'Manrope', sans-serif !important;
  }
  .risk-high { background: rgba(181,87,63,0.15); color: #D08A78; }
  .risk-mid { background: rgba(203,162,89,0.15); color: var(--amber-light); }
  .risk-low { background: rgba(127,163,122,0.15); color: #7FA37A; }

  /* distribution chart */
  .chart-card { border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; background: var(--panel); }
  .chart-caption { font-size: 12px; color: var(--text-muted); margin-top: 10px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 3px; }
  .bar-label { width: 160px; font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; color: var(--text-muted); flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 1; background: var(--border-soft); border-radius: 3px; height: 14px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--amber), #B5573F); }
  .bar-value { width: 44px; text-align: right; font-size: 11px; color: var(--text-muted); flex-shrink: 0; }

  .empty-state { color: var(--text-muted); font-size: 13.5px; padding: 24px; text-align: center; }
</style>
</head>
<body>

<div id="app">

  <!-- SIDEBAR (identical structure to index.html / pr_guardian.html) -->
  <aside id="sidebar">
    <div id="sidebar-resize-handle"></div>
    <div class="brand">
      <div class="brand-left">
        <img class="brand-mark" src="assets/icons/logo.png" alt="Fossilize AI" />
        <span class="brand-name">FOSSILIZE AI</span>
      </div>
      <div class="brand-icons">
        <button class="icon-btn icon-search" title="Search">
          <img src="assets/icons/search.png" alt="Search" />
        </button>
        <button class="icon-btn" id="collapse-btn" title="Collapse sidebar">
          <img src="assets/icons/left.png" alt="Collapse" />
        </button>
      </div>
    </div>

    <nav class="main-nav">
      <div class="nav-item" data-page="chat" onclick="window.location.href='/'">
        <img src="/assets/icons/new.png" alt="" />
        <span class="nav-label">New chat</span>
      </div>
      <div class="nav-item" data-page="chat" onclick="window.location.href='/'">
        <img src="assets/icons/chats.png" alt="" />
        <span class="nav-label">Chats</span>
      </div>
      <div class="nav-item">
        <img src="assets/icons/projects.png" alt="" />
        <span class="nav-label">Projects</span>
      </div>
      <div class="nav-item disabled" id="nav-dashboard" data-page="dashboard" title="Manager access only">
        <img src="assets/icons/dashboard.png" alt="" />
        <span class="nav-label">Dashboard</span>
      </div>
      <div class="nav-item disabled" id="nav-pr-guardian" data-page="pr-guardian" title="Manager access only" onclick="if(!this.classList.contains('disabled')) window.location.href='/pr-guardian'">
        <img src="assets/icons/guard.png" alt="" />
        <span class="nav-label">PR Guardian</span>
      </div>
    </nav>

    <div class="recents-label">Recents</div>
    <div class="recents-list" id="recents-list"></div>

    <div class="profile-strip" id="profile-strip">
      <div class="profile-left">
        <div class="avatar" id="avatar-letter">A</div>
        <div>
          <div class="profile-name" id="profile-name">Loading…</div>
          <div class="profile-role" id="profile-role">&nbsp;</div>
        </div>
      </div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-muted)"><polyline points="6 9 12 15 18 9"/></svg>
      <div class="persona-menu" id="persona-menu"></div>
    </div>
  </aside>

  <!-- MAIN -->
  <main id="main">
    <div id="topbar">
      <div class="chat-title-wrap">
        <span class="chat-title">Knowledge Risk Dashboard</span>
      </div>
    </div>

    <div id="content">
      <div>
        <div class="page-heading">Knowledge Risk Dashboard</div>
        <div class="page-subheading" id="repo-subheading">Loading…</div>
      </div>
      <div id="dashboard-body">
        <div class="empty-state">Loading…</div>
      </div>
    </div>
  </main>

</div>

<script src="sidebar.js"></script>
<script>
  const dashboardBody = document.getElementById("dashboard-body");
  const repoSubheading = document.getElementById("repo-subheading");

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }

  function formatDate(iso) {
    if (!iso) return "—";
    return new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }

  function riskClass(score) {
    if (score >= 0.5) return "risk-high";
    if (score >= 0.3) return "risk-mid";
    return "risk-low";
  }

  function renderSummary(summary) {
    repoSubheading.textContent = `${summary.repo_name} — indexed history from ${formatDate(summary.oldest_date)} to ${formatDate(summary.newest_date)}`;
    return `
      <div class="stat-bar">
        <div class="stat-cell"><div class="stat-value">${summary.total_prs_indexed}</div><div class="stat-label">PRs indexed</div></div>
        <div class="stat-cell"><div class="stat-value">${summary.total_commits_indexed}</div><div class="stat-label">Commits indexed</div></div>
        <div class="stat-cell"><div class="stat-value">${summary.unique_contributors}</div><div class="stat-label">Contributors</div></div>
        <div class="stat-cell"><div class="stat-value">${formatDate(summary.oldest_date)}</div><div class="stat-label">Oldest activity</div></div>
        <div class="stat-cell"><div class="stat-value">${formatDate(summary.newest_date)}</div><div class="stat-label">Latest activity</div></div>
      </div>`;
  }

  function renderAtRiskTable(files) {
    if (!files.length) return `<div class="empty-state">No files met the minimum PR threshold for risk scoring.</div>`;
    const rows = files.map(f => `
      <tr>
        <td class="filename-cell">${escapeHtml(f.filename)}</td>
        <td><span class="risk-badge ${riskClass(f.risk_score)}">${f.risk_score.toFixed(3)}</span></td>
        <td>${f.pr_count}</td>
        <td>${f.unique_authors}</td>
        <td>${f.avg_comments_per_pr}</td>
        <td>${formatDate(f.latest_activity)}</td>
      </tr>`).join("");
    return `
      <table class="data-table">
        <thead><tr>
          <th>File</th><th>Risk score</th><th>PRs</th><th>Contributors</th><th>Avg comments / PR</th><th>Latest activity</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  function renderContributors(contributors) {
    if (!contributors.length) return `<div class="empty-state">No contributor data available.</div>`;
    const rows = contributors.map(c => `
      <tr>
        <td>${escapeHtml(c.author)}</td>
        <td>${c.pr_count}</td>
        <td>${c.commit_count}</td>
        <td>${c.total_activity}</td>
      </tr>`).join("");
    return `
      <table class="data-table">
        <thead><tr><th>Contributor</th><th>PRs</th><th>Commits</th><th>Total activity</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  function renderDistribution(distribution) {
    if (!distribution.length) return `<div class="empty-state">No risk-scored files to plot.</div>`;
    const sorted = [...distribution].sort((a, b) => b.risk_score - a.risk_score);
    const max = sorted[0].risk_score || 1;
    const bars = sorted.map(f => `
      <div class="bar-row">
        <div class="bar-label" title="${escapeHtml(f.filename)}">${escapeHtml(f.filename)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2, (f.risk_score / max) * 100)}%"></div></div>
        <div class="bar-value">${f.risk_score.toFixed(3)}</div>
      </div>`).join("");
    return `
      <div class="chart-card">
        ${bars}
        <div class="chart-caption">${sorted.length} files scored (min. 2 PRs each) — sorted highest risk to lowest.</div>
      </div>`;
  }

  async function loadDashboard() {
    try {
      const res = await fetch("/api/dashboard-data");
      const data = await res.json();
      dashboardBody.innerHTML = `
        ${renderSummary(data.summary)}
        <div>
          <div class="section-title">At-Risk Files</div>
          ${renderAtRiskTable(data.at_risk_files)}
        </div>
        <div>
          <div class="section-title">Top Contributors</div>
          ${renderContributors(data.top_contributors)}
        </div>
        <div>
          <div class="section-title">Risk Score Distribution</div>
          ${renderDistribution(data.risk_distribution)}
        </div>`;
    } catch (err) {
      dashboardBody.innerHTML = `<div class="empty-state">Couldn't load dashboard data.</div>`;
      console.error(err);
    }
  }

  function checkAccess(user) {
    if (user && user.role === "manager") {
      loadDashboard();
    } else {
      repoSubheading.textContent = "";
      dashboardBody.innerHTML = `<div class="restricted-notice">The Knowledge Risk Dashboard is only available to manager accounts. Switch persona from the sidebar to view this page.</div>`;
    }
  }

  document.addEventListener("persona-loaded", (e) => checkAccess(e.detail));
  document.addEventListener("persona-changed", (e) => checkAccess(e.detail));
</script>

</body>
</html>
